name: Build signed APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Restore keystore from cache
        id: keystore_cache
        uses: actions/cache@v4
        with:
          path: mornye-debug.jks
          key: listenstats-keystore-v1

      - name: Create keystore (only if not cached)
        if: steps.keystore_cache.outputs.cache-hit != 'true'
        run: |
          keytool -genkeypair -v \
            -keystore mornye-debug.jks \
            -storetype PKCS12 \
            -alias listenstats \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Listen Stats, OU=Personal, O=Personal, C=IN"

      - name: Align, sign and verify APK
        run: |
          set -euo pipefail

          APK="$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "No APK found under app/build/outputs/apk/debug" >&2
            exit 1
          fi
          echo "Input APK: $APK"

          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          echo "Using build-tools: $BUILD_TOOLS"

          "$BUILD_TOOLS/zipalign" -p -f 4 "$APK" aligned.apk

          "$BUILD_TOOLS/apksigner" sign \
            --ks mornye-debug.jks \
            --ks-key-alias listenstats \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out ListenStats-signed.apk \
            aligned.apk

          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs ListenStats-signed.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ListenStats-signed-apk
          path: ListenStats-signed.apk
          if-no-files-found: error
